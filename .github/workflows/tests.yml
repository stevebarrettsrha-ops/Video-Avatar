name: CPU regression tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regressions:
    name: CPU checks (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    defaults:
      run:
        working-directory: avatar-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python tests/run.py gate units memory reuse location_checks graph api stress
      - name: Install browser test dependencies
        if: matrix.python == '3.10'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser checks, including explicit Recheck
        if: matrix.python == '3.10'
        run: python tests/run.py ui
